{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Alumni Directory</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="container">
        <h2>Verified Alumni Directory</h2>

        {% if alumni %}
        <table>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Batch</th>
                <th>Department</th>
            </tr>
            {% for a in alumni %}
            <tr>
                <td>{{ a.name }}</td>
                <td>{{ a.email }}</td>
                <td>{{ a.batch }}</td>
                <td>{{ a.department }}</td>
            </tr>
            {% endfor %}
        </table>
        {% else %}
            <p>No verified alumni found.</p>
        {% endif %}

        <div class="actions">
            <a href="/">Home</a>
        </div>
    </div>
</body>
</html>
