<!DOCTYPE html>
<html>
<head>
    <title>Teacher Verification</title>
</head>
<body>
    <h2>Unverified Alumni List</h2>

    {% if alumni %}
        <table border="1" cellpadding="10">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Batch</th>
                <th>Department</th>
                <th>Action</th>
            </tr>

            {% for a in alumni %}
            <tr>
                <td>{{ a.name }}</td>
                <td>{{ a.email }}</td>
                <td>{{ a.batch }}</td>
                <td>{{ a.department }}</td>
                <td>
                    <form method="POST">
                        {% csrf_token %}
                        <input type="hidden" name="alumni_id" value="{{ a.id }}">
                        <button type="submit">Verify</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>No unverified alumni.</p>
    {% endif %}

    <br>
    <a href="/">Back to Home</a>
</body>
</html>
