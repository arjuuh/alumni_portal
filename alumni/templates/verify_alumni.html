{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Teacher Verification</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="container">
        <h2>Teacher – Verify Alumni</h2>

        {% if alumni %}
        <table>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Batch</th>
                <th>Department</th>
                <th>Action</th>
            </tr>

            {% for a in alumni %}
            <tr>
                <td>{{ a.name }}</td>
                <td>{{ a.email }}</td>
                <td>{{ a.batch }}</td>
                <td>{{ a.department }}</td>
                <td>
                    <form method="POST">
                        {% csrf_token %}
                        <input type="hidden" name="alumni_id" value="{{ a.id }}">
                        <button type="submit">Verify</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>
        {% else %}
            <p>No unverified alumni.</p>
        {% endif %}

        <div class="actions">
            <a href="/">Home</a>
        </div>
    </div>
</body>
</html>
