<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f7;
            padding: 40px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            max-width: 900px;
            margin: auto;
        }
        h2 {
            margin-top: 30px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            padding: 12px 20px;
            background: black;
            color: white;
            border: none;
            border-radius: 8px;
        }

        .checkbox-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 15px 0;
    }

    .checkbox-row input[type="checkbox"] {
        width: 18px;
        height: 18px;
}

    </style>
</head>
<body>

<div class="card">
<form method="POST">
{% csrf_token %}

<h2>Personal Information</h2>
<input type="text" name="first_name" placeholder="First Name" value="{{ profile.first_name }}">
<input type="text" name="last_name" placeholder="Last Name" value="{{ profile.last_name }}">
<input type="text" name="gender" placeholder="Gender" value="{{ profile.gender }}">
<textarea name="address" placeholder="Address">{{ profile.address }}</textarea>
<input type="text" name="city" placeholder="City" value="{{ profile.city }}">
<input type="text" name="state" placeholder="State" value="{{ profile.state }}">
<input type="text" name="country" placeholder="Country" value="{{ profile.country }}">
<input type="text" name="postal_code" placeholder="Postal Code" value="{{ profile.postal_code }}">

<h2>Academic Details</h2>
<input type="text" name="student_id" placeholder="Student ID" value="{{ academic.student_id }}">
<input type="text" name="degree" placeholder="Degree" value="{{ academic.degree }}">
<input type="text" name="department" placeholder="Department" value="{{ academic.department }}">
<input type="text" name="college_name" placeholder="College Name" value="{{ academic.college_name }}">
<input type="number" name="year_of_admission" placeholder="Year of Admission" value="{{ academic.year_of_admission }}">
<input type="number" name="year_of_graduation" placeholder="Year of Graduation" value="{{ academic.year_of_graduation }}">
<textarea name="achievements" placeholder="Achievements">{{ academic.achievements }}</textarea>

<h2>Professional Details</h2>
<input type="text" name="current_designation" placeholder="Current Designation" value="{{ professional.current_designation }}">
<input type="text" name="current_company" placeholder="Current Company" value="{{ professional.current_company }}">
<input type="text" name="industry" placeholder="Industry" value="{{ professional.industry }}">
<input type="number" name="year_of_experience" placeholder="Years of Experience" value="{{ professional.year_of_experience }}">
<input type="text" name="company_location" placeholder="Company Location" value="{{ professional.company_location }}">
<input type="text" name="linkedin_profile" placeholder="LinkedIn Profile" value="{{ professional.linkedin_profile }}">
<textarea name="career_highlights" placeholder="Career Highlights">{{ professional.career_highlights }}</textarea>

<h2>Contact Details</h2>
<input type="email" name="contact_email" placeholder="Contact Email" value="{{ contact.email }}">
<input type="text" name="phone_number" placeholder="Phone Number" value="{{ contact.phone_number }}">
<input type="text" name="alternate_phone" placeholder="Alternate Phone" value="{{ contact.alternate_phone }}">

<h2>Alumni Engagement</h2>

<input type="text" name="membership_status" placeholder="Membership Status" value="{{ engagement.membership_status }}">

<input type="number" name="events_attended" placeholder="Events Attended" value="{{ engagement.events_attended }}">

<div class="checkbox-row">
    <input type="checkbox"
           id="mentorship_interest"
           name="mentorship_interest"
           {% if engagement.mentorship_interest %}checked{% endif %}>
    <label for="mentorship_interest">Interested in Mentorship</label>
</div>


<input type="number" step="0.01" name="donation_amount" placeholder="Donation Amount" value="{{ engagement.donation_amount }}">

<textarea name="volunteer_activities" placeholder="Volunteer Activities">{{ engagement.volunteer_activities }}</textarea>

<div class="checkbox-row">
    <input type="checkbox"
           id="newsletter_subscription"
           name="newsletter_subscription"
           {% if engagement.newsletter_subscription %}checked{% endif %}>
    <label for="newsletter_subscription">Subscribe to Newsletter</label>
</div>



<button type="submit">Save All Changes</button>

</form>
</div>

</body>
</html>
