<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approved Alumni</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fb;
            color: #111827;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
        }
        h2 { margin: 0 0 16px; }
        .sub {
            color: #6b7280;
            margin-bottom: 22px;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
        }
        .info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .name { font-weight: 700; }
        .email {
            color: #6b7280;
            font-size: 14px;
        }

        .status {
            color: #16a34a;
            font-weight: 700;
        }

        .back {
            display: inline-block;
            margin-top: 18px;
            text-decoration: none;
            color: #2563eb;
            font-weight: 600;
        }

        .empty {
            padding: 14px 16px;
            background: #f9fafb;
            border: 1px dashed #d1d5db;
            border-radius: 10px;
            color: #6b7280;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Approved Alumni List</h2>
        <div class="sub">These alumni accounts are approved.</div>

        <div class="list">
            {% for m in approved %}
                <div class="row">
                    <div class="info">
                        <div class="name">{{ m.user.username }}</div>
                        <div class="email">{{ m.user.email }}</div>
                    </div>
                    <div class="status">✔ Approved</div>
                </div>
            {% empty %}
                <div class="empty">No approved alumni yet.</div>
            {% endfor %}
        </div>

        <a class="back" href="{% url 'verify_alumni' %}">← Back to Verify Page</a>
        <br>
        <a class="back" href="{% url 'teacher_dashboard' %}">← Back to Dashboard</a>
    </div>
</body>
</html>
