<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Verify Email – AlumniHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
  :root {
    --primary:       #6C63FF;
    --primary-light: #857bff;
    --primary-glow:  rgba(108, 99, 255, 0.18);
    --primary-soft:  #f4f2ff;
    --accent:        #43C6AC;
    --warn:          #FF6584;
    --surface:       #ffffff;
    --bg:            #f5f6ff;
    --text:          #1a1a2e;
    --muted:         #7b7b9a;
    --border:        #ede9ff;
    --shadow-sm:     0 4px 18px rgba(108,99,255,0.08);
    --shadow-md:     0 12px 40px rgba(108,99,255,0.14);
    --shadow-lg:     0 24px 64px rgba(108,99,255,0.18);
    --radius:        20px;
    --font-head:     'Plus Jakarta Sans', sans-serif;
    --font-body:     'DM Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ── Atmospheric background ──────────────────────── */
  .bg-blobs {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.55;
    animation: drift 12s ease-in-out infinite alternate;
  }

  .blob-1 {
    width: 480px; height: 480px;
    background: radial-gradient(circle, #c7c2ff 0%, #6C63FF33 70%);
    top: -140px; left: -120px;
    animation-delay: 0s;
  }

  .blob-2 {
    width: 340px; height: 340px;
    background: radial-gradient(circle, #43C6AC44 0%, transparent 70%);
    bottom: -80px; right: -80px;
    animation-delay: 3s;
  }

  .blob-3 {
    width: 200px; height: 200px;
    background: radial-gradient(circle, #FFD58055 0%, transparent 70%);
    top: 55%; left: 5%;
    animation-delay: 6s;
  }

  .blob-4 {
    width: 260px; height: 260px;
    background: radial-gradient(circle, #FF658422 0%, transparent 70%);
    top: 20%; right: 8%;
    animation-delay: 2s;
  }

  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, 20px) scale(1.06); }
  }

  /* ── Floating dots pattern ───────────────────────── */
  .dots-pattern {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle, rgba(108,99,255,0.12) 1.2px, transparent 1.2px);
    background-size: 28px 28px;
  }

  /* ── Main card ───────────────────────────────────── */
  .verify-wrapper {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 460px;
    padding: 24px 20px;
    animation: slideUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(36px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .brand-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .brand-logo {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #6C63FF, #857bff);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(108,99,255,0.4);
  }

  .brand-logo i { color: #fff; font-size: 18px; }

  .brand-name {
    font-family: var(--font-head);
    font-weight: 800;
    font-size: 22px;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  .brand-name span { color: var(--primary); }

  /* Card shell */
  .card-shell {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 42px 40px 36px;
    box-shadow: var(--shadow-lg);
    border: 1.5px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  /* Decorative top-bar */
  .card-shell::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #6C63FF, #43C6AC, #FFD580, #FF6584);
    background-size: 300% 100%;
    animation: shimmer 4s linear infinite;
  }

  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  /* Icon hero */
  .icon-wrap {
    width: 76px; height: 76px;
    border-radius: 50%;
    background: var(--primary-soft);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 22px;
    position: relative;
    box-shadow: 0 0 0 12px rgba(108,99,255,0.06);
    animation: pulse-ring 2.5s ease-in-out infinite;
  }

  @keyframes pulse-ring {
    0%, 100% { box-shadow: 0 0 0 10px rgba(108,99,255,0.06); }
    50%       { box-shadow: 0 0 0 18px rgba(108,99,255,0.03); }
  }

  .icon-wrap i {
    font-size: 30px;
    background: linear-gradient(135deg, #6C63FF, #857bff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Heading */
  .card-title {
    font-family: var(--font-head);
    font-size: 26px;
    font-weight: 800;
    color: var(--text);
    text-align: center;
    letter-spacing: -0.6px;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .card-subtitle {
    text-align: center;
    font-size: 14.5px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 30px;
  }

  .card-subtitle strong {
    color: var(--primary);
    font-weight: 600;
  }

  /* ── Error alert ─────────────────────────────────── */
  .error-alert {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff5f7;
    border: 1.5px solid #ffd6de;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 22px;
    font-size: 13.5px;
    color: #c0002a;
    font-weight: 500;
    animation: shake 0.45s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%       { transform: translateX(-6px); }
    40%       { transform: translateX(6px); }
    60%       { transform: translateX(-4px); }
    80%       { transform: translateX(4px); }
  }

  .error-alert i { font-size: 15px; flex-shrink: 0; }

  /* ── OTP input group ─────────────────────────────── */
  .otp-label {
    display: block;
    font-family: var(--font-head);
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .otp-boxes {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 10px;
  }

  .otp-box {
    width: 52px;
    height: 58px;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: var(--primary-soft);
    font-family: var(--font-head);
    font-size: 24px;
    font-weight: 800;
    color: var(--primary);
    text-align: center;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s, background 0.2s;
    caret-color: var(--primary);
  }

  .otp-box:focus {
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(108,99,255,0.12), var(--shadow-sm);
    transform: translateY(-2px);
  }

  .otp-box.filled {
    border-color: var(--primary);
    background: #fff;
  }

  /* Hidden input for form submission */
  .otp-hidden { display: none; }

  /* ── Progress bar ────────────────────────────────── */
  .otp-progress {
    height: 3px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 26px;
  }

  .otp-progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6C63FF, #43C6AC);
    border-radius: 99px;
    transition: width 0.25s ease;
  }

  /* ── Verify button ───────────────────────────────── */
  .btn-verify {
    width: 100%;
    padding: 15px 20px;
    background: linear-gradient(135deg, #6C63FF 0%, #857bff 100%);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-family: var(--font-head);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.2px;
    cursor: pointer;
    box-shadow: 0 6px 22px rgba(108,99,255,0.38);
    transition: transform 0.18s, box-shadow 0.18s, background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }

  .btn-verify::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.14) 0%, transparent 100%);
    pointer-events: none;
  }

  .btn-verify:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(108,99,255,0.48);
    background: linear-gradient(135deg, #5a52e8 0%, #7b72ff 100%);
  }

  .btn-verify:active {
    transform: translateY(0);
    box-shadow: 0 4px 14px rgba(108,99,255,0.3);
  }

  .btn-verify i { font-size: 15px; }

  /* ── Divider ─────────────────────────────────────── */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .divider-line {
    flex: 1;
    height: 1.5px;
    background: var(--border);
    border-radius: 99px;
  }

  .divider-text {
    font-size: 12px;
    font-weight: 600;
    color: #bbb;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    white-space: nowrap;
  }

  /* ── Resend button ───────────────────────────────── */
  .btn-resend {
    width: 100%;
    padding: 13px 20px;
    background: var(--primary-soft);
    color: var(--primary);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    font-family: var(--font-head);
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s, transform 0.15s, box-shadow 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-resend:hover {
    background: #ebe8ff;
    border-color: var(--primary);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }

  .btn-resend:active { transform: translateY(0); }

  /* ── Countdown timer ─────────────────────────────── */
  .resend-hint {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-top: 14px;
  }

  .resend-hint .timer { color: var(--primary); font-weight: 700; }

  /* ── Footer note ─────────────────────────────────── */
  .footer-note {
    margin-top: 28px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .footer-note i { color: var(--accent); font-size: 14px; }

  /* ── Responsive ──────────────────────────────────── */
  @media (max-width: 500px) {
    .card-shell { padding: 32px 24px 28px; }
    .otp-box    { width: 44px; height: 50px; font-size: 20px; }
    .card-title { font-size: 22px; }
  }

  @media (max-width: 380px) {
    .otp-box { width: 38px; height: 46px; font-size: 18px; gap: 7px; }
    .otp-boxes { gap: 7px; }
  }
</style>
</head>
<body>

<!-- Atmospheric background -->
<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
</div>
<div class="dots-pattern"></div>

<!-- Main content -->
<div class="verify-wrapper">

  <!-- Brand -->
  <div class="brand-row">
    <div class="brand-logo"><i class="fas fa-graduation-cap"></i></div>
    <div class="brand-name">Alumni<span>Hub</span></div>
  </div>

  <!-- Card -->
  <div class="card-shell">

    <!-- Icon hero -->
    <div class="icon-wrap">
      <i class="fas fa-envelope-open-text"></i>
    </div>

    <h1 class="card-title">Verify your email</h1>
    <p class="card-subtitle">
      We've sent a <strong>6-digit code</strong> to your registered<br>
      email address. Enter it below to continue.
    </p>

    <!-- Error message -->
    {% if error %}
    <div class="error-alert">
      <i class="fas fa-circle-exclamation"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- OTP Form -->
    <form method="POST" action="{% url 'verify_otp' %}" id="otpForm" autocomplete="off">
      {% csrf_token %}

      <label class="otp-label" for="otp-1">Enter your code</label>

      <!-- Visual OTP boxes -->
      <div class="otp-boxes" id="otpBoxes">
        <input class="otp-box" id="otp-1" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" aria-label="Digit 1">
        <input class="otp-box" id="otp-2" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" aria-label="Digit 2">
        <input class="otp-box" id="otp-3" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" aria-label="Digit 3">
        <input class="otp-box" id="otp-4" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" aria-label="Digit 4">
        <input class="otp-box" id="otp-5" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" aria-label="Digit 5">
        <input class="otp-box" id="otp-6" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" aria-label="Digit 6">
      </div>

      <!-- Progress bar -->
      <div class="otp-progress">
        <div class="otp-progress-bar" id="otpProgressBar"></div>
      </div>

      <!-- Hidden real input that gets submitted -->
      <input type="hidden" name="otp" id="otpHidden" required>

      <button type="submit" class="btn-verify" id="verifyBtn">
        <i class="fas fa-shield-check"></i>
        Verify &amp; Continue
      </button>
    </form>

    <!-- Divider -->
    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">Didn't receive it?</span>
      <div class="divider-line"></div>
    </div>

    <!-- Resend Form -->
    <form method="POST" action="{% url 'resend_otp' %}" id="resendForm">
      {% csrf_token %}
      <button type="submit" class="btn-resend" id="resendBtn" disabled>
        <i class="fas fa-rotate-right"></i>
        Resend Code
      </button>
    </form>

    <p class="resend-hint" id="resendHint">
      Resend available in <span class="timer" id="countdown">30</span>s
    </p>

  </div><!-- /card-shell -->

  <!-- Footer note -->
  <p class="footer-note">
    <i class="fas fa-lock"></i>
    Your code is valid for 10 minutes and is encrypted in transit.
  </p>

</div><!-- /verify-wrapper -->

<script>
  /* ── OTP box interactions ────────────────────────── */
  const boxes    = Array.from(document.querySelectorAll('.otp-box'));
  const hidden   = document.getElementById('otpHidden');
  const progress = document.getElementById('otpProgressBar');

  function syncHidden() {
    hidden.value = boxes.map(b => b.value).join('');
    const filled = boxes.filter(b => b.value !== '').length;
    progress.style.width = (filled / 6 * 100) + '%';
    boxes.forEach(b => b.classList.toggle('filled', b.value !== ''));
  }

  boxes.forEach((box, i) => {
    box.addEventListener('input', e => {
      const val = e.target.value.replace(/\D/g, '');
      box.value = val.slice(-1);
      syncHidden();

      // Paste full code from first box
      if (val.length > 1 && i === 0) {
        const digits = val.slice(0, 6).split('');
        digits.forEach((d, idx) => {
          if (boxes[idx]) boxes[idx].value = d;
        });
        syncHidden();
        boxes[Math.min(digits.length, 5)].focus();
        return;
      }

      if (box.value && i < 5) boxes[i + 1].focus();
    });

    box.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !box.value && i > 0) {
        boxes[i - 1].value = '';
        boxes[i - 1].focus();
        syncHidden();
      }
      if (e.key === 'ArrowLeft'  && i > 0) boxes[i - 1].focus();
      if (e.key === 'ArrowRight' && i < 5) boxes[i + 1].focus();
    });

    box.addEventListener('paste', e => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
      text.slice(0, 6).split('').forEach((d, idx) => {
        if (boxes[idx]) boxes[idx].value = d;
      });
      syncHidden();
      boxes[Math.min(text.length, 5)].focus();
    });

    box.addEventListener('focus', () => box.select());
  });

  /* Auto-submit when all 6 filled */
  document.getElementById('otpForm').addEventListener('input', () => {
    if (boxes.every(b => b.value !== '')) {
        syncHidden(); // ensure hidden input updated
        setTimeout(() => document.getElementById('otpForm').submit(), 320);
    }
  });

  /* ── Resend countdown timer ──────────────────────── */
  let seconds    = 30;
  const countdown  = document.getElementById('countdown');
  const resendBtn  = document.getElementById('resendBtn');
  const resendHint = document.getElementById('resendHint');

  const timer = setInterval(() => {
    seconds--;
    countdown.textContent = seconds;
    if (seconds <= 0) {
      clearInterval(timer);
      resendBtn.disabled = false;
      resendHint.innerHTML = '<span style="color:var(--accent);font-weight:600;"><i class="fas fa-circle-check" style="margin-right:5px"></i>Ready to resend</span>';
    }
  }, 1000);

  /* Focus first box on load */
  window.addEventListener('DOMContentLoaded', () => boxes[0].focus());

  /* Prevent form submission if OTP incomplete */
    document.getElementById("otpForm").addEventListener("submit", function(e){
    syncHidden(); 
    if(hidden.value.length !== 6){ 
        e.preventDefault();
        alert("Please enter the 6-digit verification code."); 
    }
});
</script>

</body>
</html>
